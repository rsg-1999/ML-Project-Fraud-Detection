# Jobs, pipeline and compute settings as code. Deploy from your machine:
#   databricks bundle validate -p <profile> && databricks bundle deploy -p <profile>
# The deploy uploads fraud_pipeline/ to your workspace; jobs run those files (no notebooks, plain Python scripts).
bundle:
  name: fraud_detection

variables:
  schedule_status:  # PAUSED or UNPAUSED; switch on with: databricks bundle deploy --var schedule_status=UNPAUSED
    default: PAUSED

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-5c2e98ef-3c85.cloud.databricks.com

sync:
  exclude: [tests, "*.ipynb", "*.pptx", data, models]

resources:
  pipelines:
    fraud_etl:  # bronze -> silver -> gold, Databricks works out the order and shows the graph
      name: fraud_etl
      catalog: workspace
      schema: fraud
      serverless: true
      root_path: fraud_pipeline
      libraries:
        - file: {path: fraud_pipeline/pipeline_bronze.py}
        - file: {path: fraud_pipeline/pipeline_silver.py}
        - file: {path: fraud_pipeline/pipeline_gold.py}

  jobs:
    fraud_initial_load:  # run once (or after a reset): schema, simulate arrivals, build all tables, first model, first scoring
      name: fraud_initial_load
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies: [xgboost, imbalanced-learn, "mlflow>=3"]
      tasks:
        - task_key: setup
          environment_key: ml
          spark_python_task: {python_file: fraud_pipeline/setup_workspace.py}
        - task_key: simulate_arrivals
          depends_on: [{task_key: setup}]
          environment_key: ml
          spark_python_task: {python_file: fraud_pipeline/simulate_arrivals.py}
        - task_key: etl
          depends_on: [{task_key: simulate_arrivals}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.fraud_etl.id}
            full_refresh: true
        - task_key: train
          depends_on: [{task_key: etl}]
          environment_key: ml
          spark_python_task: {python_file: fraud_pipeline/train.py}
        - task_key: score
          depends_on: [{task_key: train}]
          environment_key: ml
          spark_python_task: {python_file: fraud_pipeline/score.py}

    fraud_next_batch:  # each run: next batch arrives -> pipeline picks it up -> check/retrain -> score
      name: fraud_next_batch
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"  # every 15 minutes while testing; use "0 0 6 * * ?" for daily
        timezone_id: UTC
        pause_status: ${var.schedule_status}
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies: [xgboost, imbalanced-learn, "mlflow>=3"]
      tasks:
        - task_key: arrive
          environment_key: ml
          spark_python_task: {python_file: fraud_pipeline/arrive_next_batch.py}
        - task_key: etl
          depends_on: [{task_key: arrive}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.fraud_etl.id}
        - task_key: check_batch
          depends_on: [{task_key: etl}]
          environment_key: ml
          spark_python_task: {python_file: fraud_pipeline/check_batch.py}
        - task_key: score
          depends_on: [{task_key: check_batch}]
          environment_key: ml
          spark_python_task: {python_file: fraud_pipeline/score.py}

    fraud_reset:  # destructive: databricks bundle run fraud_reset --params delete_model=yes
      name: fraud_reset
      parameters:
        - name: delete_model
          default: "no"
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies: [xgboost, imbalanced-learn, "mlflow>=3"]
      tasks:
        - task_key: reset
          environment_key: ml
          spark_python_task:
            python_file: fraud_pipeline/reset.py
            parameters: ["--delete-model", "{{job.parameters.delete_model}}"]

    fraud_full_demo:  # one click, from scratch: reset -> initial load -> the three arrival batches, one after another
      name: fraud_full_demo
      tasks:
        - task_key: reset
          run_job_task:
            job_id: "${resources.jobs.fraud_reset.id}"
            job_parameters: {delete_model: "yes"}
        - task_key: initial_load
          depends_on: [{task_key: reset}]
          run_job_task: {job_id: "${resources.jobs.fraud_initial_load.id}"}
        - task_key: batch_1
          depends_on: [{task_key: initial_load}]
          run_job_task: {job_id: "${resources.jobs.fraud_next_batch.id}"}
        - task_key: batch_2
          depends_on: [{task_key: batch_1}]
          run_job_task: {job_id: "${resources.jobs.fraud_next_batch.id}"}
        - task_key: batch_3
          depends_on: [{task_key: batch_2}]
          run_job_task: {job_id: "${resources.jobs.fraud_next_batch.id}"}
